name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pre-commit
        run: pip install pre-commit==4.5.1

      - name: Get changed files
        id: changed
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            base_ref="origin/${{ github.base_ref }}"
            files=$(git diff --name-only --diff-filter=ACMR \
              "${base_ref}"...HEAD)
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            files=$(git diff --name-only --diff-filter=ACMR HEAD^ HEAD)
          else
            files=$(git ls-files)
          fi

          files=$(printf "%s\n" ${files:-} \
            | grep -v '^fluxvla/models/third_party_models/' \
            | tr '\n' ' ')
          echo "files=${files}" >> "$GITHUB_OUTPUT"

      - name: Run pre-commit on changed files
        if: steps.changed.outputs.files != ''
        run: pre-commit run --files ${{ steps.changed.outputs.files }}

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install test dependencies
        run: pip install pytest==8.3.4

      - name: Run CI smoke tests
        run: python -m pytest test/test_ci_smoke.py

  import-check:
    name: Import Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run lightweight import and syntax checks
        env:
          FLUXVLA_REMOTE_CLIENT_ONLY: '1'
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import compileall
          import os
          import runpy

          import fluxvla

          assert fluxvla.__name__ == 'fluxvla'
          assert os.environ['FLUXVLA_REMOTE_CLIENT_ONLY'] == '1'

          cfg = runpy.run_path(
              'configs/pi05/pi05_paligemma_tron2_lora_finetune.py')
          assert cfg['inference']['action_layout'] == 'tron2_16'

          paths = [
              'configs',
              'scripts',
              'fluxvla/engines/operators',
              'fluxvla/engines/runners',
          ]
          for path in paths:
              assert compileall.compile_dir(path, quiet=1)
          PY
